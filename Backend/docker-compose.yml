version: "3.9"

services:
  api:
    build: .
    container_name: cigarreria_api
    restart: always
    env_file:
      - .env
    ports:
      - "8000:8000"
    depends_on:
      - mysql
      - redis
    volumes:
      - .:/app

  mysql:
    image: mysql:8.0
    container_name: cigarreria_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${Pass-Sql}
      MYSQL_DATABASE: ${Database-Sql}
    ports:
      - "3307:3306"
    volumes:
      - "C:/BaseDatos/cigarreria:/var/lib/mysql"

  redis:
    image: redis:7
    container_name: cigarreria_redis
    restart: always
    ports:
      - "6379:6379"
